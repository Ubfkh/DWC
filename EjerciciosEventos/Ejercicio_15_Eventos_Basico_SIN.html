<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">
<html xmlns="http://w3.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Ejercicio 15 - Base Inicial</title>
    <style type="text/css">
        body {
            font-family: arial, helvetica;
        }
        #info {
            width: 160px;
            border: thin solid silver;
            padding: .5em;
            position: fixed;
            background-color: #fcfcfc;
        }
        #info h1 {
            margin: 0;
            font-size: 1.2em;
        }
    </style>
    <script type="text/javascript">

        // TU CÓDIGO JAVASCRIPT DEBE IR AQUÍ
        // Pista: Debes asignar las funciones controladoras a document o window
        // ejemplo: document.onmousemove = tuFuncion;

        //Añadimos a la ventana para que recoja el evento de mover el ratón
        window.addEventListener('mousemove', (evento) => {

            //Cogemos las coordenadas del ratón
            let x = evento.clientX;
            let y = evento.clientY;

            //Metemos las coordenadas en el texto del párrafo
            let p = document.getElementById('p');
            p.textContent = `Coordenada X: ${x} \n Coordenada Y: ${y}`;

            //cambiamos el color del cuadro de información
            const info = document.getElementById('info');
            info.style.backgroundColor = '#FFFFFF';
        });

        //Añadimos a la ventana para que recoja el evento de pulsar una tecla
        window.addEventListener('keypress', (evento) => {

            //vemos qué tecla ha sido pulsada
            let tecla = String.fromCharCode(evento.charCode);

            //metemos la tecla en el texto del párrafo
            let p = document.getElementById('p');
            p.textContent = `tecla: ${tecla}`;
            
            //cambiamos el color del cuadro de información
            const info = document.getElementById('info');
            info.style.backgroundColor = '#CCE6FF';
        });


        //Añadimos a la ventana para que recoja el evento de cuando se pulsa el ratón
        window.addEventListener('click', (evento) => {

            //cambiamos el color del cuadro de información
            const info = document.getElementById('info');
            info.style.backgroundColor = '#FFFFCC';
        });

    </script>
</head>
<body id="body">
<div id="info">
    <h1>Información</h1>
    <p id="p">Mueve el ratón o pulsa una tecla para ver los detalles del evento.</p>
</div>

<div style="height: 1000px;"></div> <!-- Espacio para poder hacer scroll y probar pageX/pageY -->
</body>
</html>
