<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 34</title>
</head>
<body>
  <h1>Lookbehind negativo</h1>
  <p>Extrae los números que no están precedidos por $.</p>
  <script>
    const texto = "$1 y 2";
    const res = texto.match(/(?<!\$)\b\d/);
    console.log(res);
  </script>
</body>
</html>
