<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 18</title>
</head>
<body>
  <h1>Cero o más repeticiones</h1>
  <p>Comprueba que el patrón acepta tanto &quot;ac&quot; como &quot;abbbc&quot;.</p>
  <script>

    const texto = "ac";
    const texto2 = "abbbc";

    let res = texto.match(/^(ac|abbbc)$/);

    console.log(res);

    res = texto2.match(/^(ac|abbbc)$/);

    console.log(res);
  </script>
</body>
</html>
