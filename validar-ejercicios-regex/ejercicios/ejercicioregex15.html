<head>

  <title>Ejercicio regex 15</title>

<body>
  <h1>Validar toda la cadena</h1>
  <p>Comprueba que el texto contiene exactamente cuatro dígitos, ni más ni menos.</p>
  <script>
    const codigo = "0831";
    const res = codigo.match(/[0-9]{4}$/);
    console.log(res);
  </script>
