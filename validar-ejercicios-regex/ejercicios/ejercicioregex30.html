<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 30</title>
</head>
<body>
  <h1>Referencia a un grupo con nombre</h1>
  <p>Comprueba si hay una letra seguida por la misma letra, ignorando mayúsculas.</p>
  <script>
    const texto = "Abba";
    const res = /(\w)\1/i.test(texto);
    console.log(res);
  </script>
</body>
</html>
