<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio regex 20</title>
</head>
<body>
  <h1>Carácter opcional</h1>
  <p>Comprueba que un patrón acepta tanto &quot;color&quot; como &quot;colour&quot;.</p>
  <script>

    const res1 = "color".match(/color || colour/);
    const res2 = "colour".match(/color || colour/);

    console.log(res1);
    console.log(res2);
  </script>
</body>
</html>
